name: Validate datapack

on:
  push:
    branches:
      - main
      - develop/1.0-stabilization
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-datapack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datapack-validation:
    name: Release validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validator
        run: |
          python -X utf8 -m py_compile .github/scripts/validate_datapack.py .github/scripts/test_validate_datapack.py
          rm -rf .github/scripts/__pycache__

      - name: Run validator self-tests
        run: python -B -X utf8 .github/scripts/test_validate_datapack.py

      - name: Validate release source
        run: python -B -X utf8 .github/scripts/validate_datapack.py --warnings-as-errors